# Publishes the repo as-is to GitHub Pages. There is no build step: the HTML,
# CSS, fonts and artwork in this checkout are the site.
name: Deploy static content to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are skipped, but a run in progress is
# never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pages publishes a whole directory, so the two files that document the
      # repo rather than serve the site are left out of it. CNAME is not: it is
      # what binds the custom domain to this deployment.
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'AGENTS.md' \
            --exclude 'README.md' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
