# Publishes the repo as-is to GitHub Pages. There is no build step: the HTML,
# CSS, fonts and artwork in this checkout are the site.
name: Deploy static content to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are skipped, but a run in progress is
# never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history, so the IndexNow step can diff against the previous push.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pages publishes a whole directory, so the two files that document the
      # repo rather than serve the site are left out of it. CNAME is not: it is
      # what binds the custom domain to this deployment.
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'AGENTS.md' \
            --exclude 'README.md' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Tells Bing - and through its index ChatGPT search, Copilot and
      # DuckDuckGo - which pages this push changed, so they are recrawled now
      # rather than whenever the crawler comes round. The key file at the root
      # proves the site holds the key. A manual run, or a push whose parent is
      # unknown, submits every page. A failed ping never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          KEY: 4f788c756ba49f94dc46567ec756122c
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pages=$(git diff --name-only "$BEFORE" HEAD -- '*.html')
          else
            pages=$(git ls-files '*.html')
          fi
          urls=$(printf '%s\n' $pages | grep -vx '404.html' \
            | sed -E 's#(^|/)index\.html$#\1#; s#\.html$##; s#^#https://keera.ch/#')
          if [ -z "$urls" ]; then
            echo "No page changed."
            exit 0
          fi
          printf '%s\n' $urls
          printf '%s\n' $urls | jq -R . | jq -s --arg key "$KEY" \
            '{host: "keera.ch", key: $key,
              keyLocation: ("https://keera.ch/" + $key + ".txt"), urlList: .}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
