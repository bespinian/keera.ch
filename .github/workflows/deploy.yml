# Deploys the static site to the Infomaniak web host over FTP
name: Deploy static content via FTP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Queued runs are skipped, but a run in progress is
# never cancelled.
concurrency:
  group: "ftp-deploy"
  cancel-in-progress: false

env:
  FTP_HOST: h2park-8d750cc5.infomaniak.ch
  FTP_PORT: "21"
  FTP_USER: z27etf_github
  REMOTE_DIR: "."

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      # Only the uploaded copy carries the ?v=<content hash> stamps; the
      # dirtied checkout is thrown away with the runner.
      - name: Stamp cache-busting hashes onto asset URLs
        run: python3 .github/scripts/fingerprint-assets.py

      - name: Deploy via FTP
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Two passes, and the order is load-bearing: a page must never go
          # up citing an asset whose bytes are not there yet, or the browser
          # caches the old file for a year under the new URL. The second pass
          # carries --delete, so removed assets are still cleaned up.
          lftp -c "
            set net:max-retries 3;
            set net:timeout 20;
            set ftp:ssl-allow false;
            open -u '$FTP_USER' --env-password ftp://$FTP_HOST:$FTP_PORT;
            mirror --reverse --verbose --no-perms --parallel=2 \
              ./assets $REMOTE_DIR/assets;
            mirror --reverse --delete --verbose --no-perms --parallel=2 \
              --exclude '^\.git' \
              --exclude '^AGENTS\.md$' \
              --exclude '^README\.md$' \
              --exclude '^\.ftpquota$' \
              --exclude '^\.well-known/' \
              ./ $REMOTE_DIR;
          "
